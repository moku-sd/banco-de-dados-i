services:
  postgres:
    image: postgres:18
    container_name: bd1-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd1

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: bd1-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mateus.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    restart: unless-stopped


volumes:
  postgres_data:
  pgadmin_data: